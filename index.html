var SC={A:['Давайте честно: лишние килограммы — это не только фигура. Они давят на сердце и суставы, забирают энергию, сон и нередко самооценку и желание близости.','Если ничего не менять, обычно вес растёт медленно, но уверенно: усталость копится, отёки остаются, а уверенности в себе становится меньше.','Хорошая новость: это решаемо. Для этого у нас комплекс и нутрициолог. Ваша цель — минус {X} кг; вместе с рационом мы идём к ней шаг за шагом.','Скажите, если вернуть лёгкость и уверенность в себе, что изменится в вашей жизни, в том числе в отношениях?'],

var CMP=[
['Корглутид GLP-1','Это главный «контролёр аппетита». В организме есть гормон сытости GLP-1: после еды он сообщает мозгу «ты наелся». Компонент вдохновлён этим механизмом, поэтому сытость держится дольше и меньше тянет на перекусы. Потому и вечерние срывы случаются реже.','Заявлен производителем как компонент, вдохновлённый сигнализацией ГПП-1: глюкагоноподобный пептид-1 вырабатывается L-клетками кишечника, замедляет опорожнение желудка и действует на центры насыщения гипоталамуса. Точный состав и дозу уточняйте у производителя: это БАД, а не препарат. Работает в связке с инулином: его ферментация даёт короткоцепочечные жирные кислоты, которые тоже стимулируют секрецию ГПП-1 и PYY.','«Вы сказали, что перекусываете по вечерам: именно здесь компонент помогает дольше чувствовать сытость»','насыщение аппетит голод сладкое перекус','Corglutid GLP-1 — ГПП-1-ориентированный компонент'],
['Шафран','Шафран работает на настроение. Когда нервничаем, рука тянется к сладкому: это «заедание эмоций». Шафран мягко поддерживает хорошее настроение, поэтому нет такой потребности заедать стресс. Меньше тревоги — меньше лишней еды.','Действующие вещества: кроцины, пикрокроцин и сафранал. В клинических исследованиях экстракт ассоциируется с улучшением настроения и снижением эмоционального переедания и перекусов, предположительно через серотонинергическую передачу. Дополняет L-теанин: шафран поддерживает настроение, теанин — спокойствие.','«Вы сказали, что заедаете стресс, шафран как раз про это»','стресс настроение сладкое эмоции','Crocus sativus L. — экстракт шафрана (кроцин, сафранал)'],
['Джимнема','«Приглушитель сладкого»: вкус сладкого становится менее ярким, шоколад и конфеты уже не так притягивают. Потому отказаться от сладкого проще, без борьбы с собой.','Гимнемовые кислоты структурно схожи с глюкозой и конкурентно связываются с рецепторами сладкого на языке, снижая интенсивность вкуса; есть данные и о влиянии на всасывание глюкозы. Вместе с белой фасолью (крахмал) и ГПП-1-компонентом формирует контур контроля углеводной тяги.','«Вам сложно без сладкого? Здесь поможет джимнема»','сахар сладкое тяга шоколад','Gymnema sylvestre R.Br. — гимнемовые кислоты'],
['L-теанин','Аминокислота из зелёного чая, «мягкий успокоитель» без сонливости: голова ясная, внутри спокойнее. А когда вы спокойны, вы не набрасываетесь на еду вечером. Заодно помогает лучше спать, а во сне организм регулирует голод.','Структурный аналог глутамата; проходит гематоэнцефалический барьер, повышает альфа-активность мозга, модулирует ГАМК и глутаматергическую передачу, снижает стресс-реакцию. Хороший сон и сниженный кортизол косвенно влияют на гормоны аппетита (грелин, лептин).','«Вы плохо спите и нервничаете: теанин поддержит спокойствие и сон»','стресс сон нервы тревога','L-theanine (N-этил-L-глутамин)'],
