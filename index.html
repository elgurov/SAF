br:[['«Да, оставляла»','Поблагодарите, переходите дальше: «Отлично, тогда сразу к делу».'],['«Не помню / не оставляла»','«Заявка пришла с нашего сайта по теме контроля веса. Тема вам знакома?» Если да, предложите 2 минуты.'],['«Это реклама?»','Кнопка «Возражение».']],

{n:'Рамка разговора',g:'Получить согласие на 10–15 минут, задать план и закрепить секретное слово',

br:[['«Удобно»','Сразу: «Тогда начнём» и к потребностям.'],['«Неудобно»','Кнопка «Возражение», зафиксируйте точное время звонка.'],['«Напишите в WhatsApp»','Кнопка «Возражение».']],

{n:'Потребности',g:'Выявить цель, боль и цену бездействия (SPIN)',

ask:['Сколько вам лет, какой у вас рост и вес?','Сколько килограммов вы хотите убрать и к какому сроку? Есть ли событие, к которому хочется быть в форме?','Что вы уже пробовали: питание, БАДы, травы, спорт? Что получилось, а что нет?','Что именно вас не устраивает сейчас: как вы выглядите, как чувствуете себя или и то и другое?','Когда обычно тянет на еду: вечером, в стрессе, «на автомате»?','Как это влияет на вашу жизнь: одежда, энергия, настроение, отношения?','Если ничего не менять, как будет через полгода?','А что изменится у вас, когда вы вернёте форму? Как вы себя увидите?','Насколько для вас это важно по шкале от 1 до 10?'],
br:[['Называет цель','Запишите цифры, повторите её её же словами: «Правильно понимаю, вы хотите ___ к ___?»'],['Не хочет называть вес','«Цифры нужны только для расчёта курса, хватит примерных».'],['Называет проблемы со здоровьем','Кнопка «Здоровье», затем этап «Подбор».'],['Отвечает коротко','Задайте уточнение: «Расскажите подробнее», «А что ещё?»']],

{n:'Подбор',g:'Собрать детали для индивидуальной схемы и «прогреть» клиента',

br:[['Беременность / ГВ','Курс не предлагать. Мягко: «Тогда вернёмся к этому позже», зафиксировать контакт.'],['Хронические болезни, лекарства','«Комплекс не заменяет лечение. Нутрициолог подскажет, как совместить». Эффект не обещать.'],['Боль в груди, одышка в покое, резкая слабость','Остановить продажу, посоветовать срочно обратиться к врачу.'],['Смущается личных вопросов','«Это только для точности подбора, отвечайте как комфортно» и идите дальше.']],

{n:'Презентация',g:'Связать каждый плюс продукта с тем, что сказал клиент (свойство → выгода)',
say:['{имя}, вы сказали, что ___. Именно для этого и создан SAF.','SAF — инновационный комплекс: капсулы для контроля аппетита и саше Lite & Balance для обмена веществ, энергии и пищеварения. Отборные компоненты из Южной Кореи и Германии, готовый продукт производится в Казахстане.','Капсулы: Corglutid GLP-1 помогает дольше сохранять чувство сытости, шафран и джимнема снижают тягу к сладкому, L-теанин даёт спокойствие, белая фасоль помогает с усвоением углеводов. Первая неделя по 1 капсуле утром и вечером, с 8-го дня по 2.','Саше: афрамомум, CLA, таурин, L-тирозин поддерживают обмен и энергию без кофеина, глутатион и витамин C дают антиоксидантную поддержку, инулин заботится о микрофлоре. Стик 2,5 г, вишнёвый вкус.','1-й месяц: вы почувствуете спокойствие и лёгкость, уйдёт тяга к лишнему. Ориентир компании: минус 4–8 кг.','2-й месяц: налаживаются обмен и пищеварение, подключается комплексный эффект. Ориентир: суммарно минус 8–16 кг.','Около 5 месяцев: закрепление, энергия, тонус. 7–10 месяцев: стройность, упругость кожи, результат на долгий срок.','Результат индивидуален и зависит от питания и режима. Поэтому я закреплю за вами лучшего нутрициолога: он на связи 24/7 и составит вам диету и упражнения. Вы готовы преобразиться?'],
ask:['Что из этого для вас сейчас самое важное?','Вы представляете, как это ляжет в ваш день?'],
br:[['Спрашивает о побочках','Возражение «Побочные эффекты».'],['Спрашивает про диабет, давление, суставы','Кнопка «Здоровье»; эффект не обещать.'],['Просит прислать состав','Возражение «WhatsApp».'],['Молчит / «ну ладно»','Пробный вопрос: «Что вам отозвалось больше всего?»']],

{n:'Промокод и цена',g:'Активировать промокод, дать якорь, предложить 2 курса и спросить выбор',promo:1,

 if(s.promo)h+='<div class="card"><b>🔑 Секретное слово: «ЛЕГКОСТЬ»</b><div class="mu">Клиент должен вспомнить его сам. Назвал, значит скидка −40% на весь разговор. Вводить ничего не нужно.</div></div>';
 if(s.promo||s.close)h+=prices();
 if(s.ask.length)h+=s.ask.map(function(t,i){return line('ask',(sayList(s).length+i+1)+'',t)}).join('');
 if(s.end)h+=resBtns();
 if(s.br.length)h+='<details><summary>Реакции клиента и ваши действия</summary>'+s.br.map(function(b){return'<div class="br"><b>'+b[0]+'</b><span>'+b[1]+'</span></div>'}).join('')+'</details>';
 h+='<div class="tip">💡 '+s.tip+'</div>';
 $('m').innerHTML=h;
 $('pb').innerHTML=ST.map(function(x,i){return'<button class="'+(i<S.st?'done':i==S.st?'cur':'')+'" onclick="go('+i+')"><i></i>'+x.n+'</button>'}).join('');
 $('bk').disabled=S.st==0;$('nx').disabled=S.st==ST.length-1;$('bk').style.opacity=S.st==0?.4:1;$('nx').style.opacity=S.st==ST.length-1?.4:1;save()}
function bmi(){var h=+S.h,w=+S.w;if(!h||!w)return null;var b=w/Math.pow(h/100,2),id=S.g=='m'?h-100-(h-150)/4:h-100-(h-150)/2.5;return{b:b,id:id,d:w-id,st:b<18.5?'Дефицит массы':b<25?'Норма':b<30?'Избыток массы':b<35?'Ожирение I ст.':b<40?'Ожирение II ст.':'Ожирение III ст.'}}
function rec(){var d=bmi();if(!d||d.b<18.5)return null;var T=+S.t||Math.max(Math.round(d.d),0),norm=!+S.t&&T<=2,need=norm?3:Math.max(1,Math.ceil(T/6));function pk(m){for(var i=0;i<PR.length;i++)if(PR[i][1]>=m)return i;return PR.length-1}var id=pk(need+2);return{T:T,norm:norm,need:need,bs:pk(need),id:id,mx:Math.min(PR.length-1,id+1)}}
function cc(){var d=bmi();if(!d)return'';var r=rec();return'<div class="card"><b>Клиент:</b> '+esc(S.h)+' см, '+esc(S.w)+' кг'+(S.a?', '+esc(S.a)+' лет':'')+' · ИМТ '+d.b.toFixed(1)+' ('+d.st+')'+(r&&!r.norm?' · цель −'+r.T+' кг':'')+'</div>'}
function tabs(){var T=['💬 Разговор','⚖️ Вес и курс','🧪 Состав','💰 Прайс'];$('tb').innerHTML=T.map(function(t,i){return'<button class="'+((S.tab||0)==i?'on':'')+'" onclick="S.tab='+i+';draw();scrollTo(0,0)">'+t+'</button>'}).join('')}
function pitch(r,k){var p=PR[k],d=p[2]/(p[1]*30);return(r.norm?'Для детокса, тонуса и энергии оптимально курс на ':'Исходя из ваших '+r.T+' кг и запаса на закрепление результата оптимально курс на ')+p[1]+' мес.: '+p[1]+' '+pl(p[1])+' капсул и '+p[1]+' упаковок саше в подарок за '+fm(p[2])+' ₸. Это около '+fm(d)+' ₸ в день, а по Kaspi 12: '+fm(p[3])+' ₸ в месяц.'}
function calcPane(){return'<h2>⚖️ Анализ веса</h2><div class="card"><div class="row"><input id="ih" type="number" inputmode="numeric" placeholder="Рост, см" value="'+esc(S.h||'')+'"><input id="iw" type="number" inputmode="decimal" placeholder="Вес, кг" value="'+esc(S.w||'')+'"></div><div class="row" style="margin-top:8px"><input id="ia" type="number" placeholder="Возраст" value="'+esc(S.a||'')+'"><input id="it" type="number" inputmode="decimal" placeholder="Цель, кг (если назвала)" value="'+esc(S.t||'')+'"></div><div class="chips"><button id="gf" class="'+(S.g=='m'?'':'on')+'">Женщина</button><button id="gm" class="'+(S.g=='m'?'on':'')+'">Мужчина</button></div></div><div id="co"></div>'}
function calcOut(){C=[];var d=bmi(),r=rec();if(!d)return'<div class="card mu">Введите рост и вес: курс подберётся автоматически.</div>';
var h='<div class="card"><div class="mu">ИМТ '+d.b.toFixed(1)+' · '+d.st+'</div>Ориентир веса: <b>'+d.id.toFixed(0)+' кг</b>, разница <b>'+(d.d>0?'+':'')+d.d.toFixed(1)+' кг</b></div>';
if(!r)return h+'<div class="card mu">Дефицит массы: уводите разговор на энергию, тонус и питание.</div>';
var p=PR[r.id];
h+='<div class="card" style="border-color:var(--em);background:var(--emd)"><div class="mu">'+(r.norm?'Цель: детокс, тонус, энергия':'Цель −'+r.T+' кг ≈ '+r.need+' мес. + запас 2 мес. на закрепление')+'</div><div class="big">⭐ Курс '+p[0]+' · '+p[1]+' мес.</div><div>'+fm(p[2])+' ₸ · '+fm(p[2]/(p[1]*30))+' ₸/день · Kaspi 12: '+fm(p[3])+' ₸/мес</div></div>';
h+=line('say','Предложить',pitch(r,r.id));
var T=r.T,L=r.norm?['Вес в норме, а тонуса и энергии нет: это скрытая усталость, она копится.','Чем дольше откладывать, тем сложнее вернуть форму. Начнём сегодня.']:T<=5?['Сейчас убрать проще всего: потом килограммы закрепляются и уходят вдвое дольше.','Месяц без плана — те же привычки и тот же вес. Начнём сегодня, чтобы к сезону быть в форме.']:T<=15?['Диета без контроля аппетита почти всегда заканчивается срывом: нужна система, а не сила воли.','Вы уже пробовали сами, а {T} кг остались. Ещё полгода «потом» — и цель станет больше.','Представьте себя через 3 месяца: с курсом или без него.']:T<=30?['Столько сами не уходит: без плана вес чаще растёт, чем падает.','Нагрузка на суставы и сердце растёт вместе с весом, усталость и одышка первые сигналы. Чем раньше начнёте, тем легче.','Короткий курс остановит вас на полпути, поэтому берём длинный с запасом.']:['Это большой путь, и короткий курс его не закроет: нужен длинный курс и нутрициолог рядом.','Каждый месяц ожидания — это ещё месяц с этим весом. Нужно начинать сегодня.','Без системы вы сдадитесь на втором месяце, как раньше. Берём курс с запасом.'];
h+='<h3>Аргументы под вес</h3>'+L.map(function(x){return line('say','Реплика',x.replace('{T}',T))}).join('');
var ks=[r.bs,r.mx].filter(function(v){return v!=r.id}).filter(function(v,i,a){return a.indexOf(v)==i});
h+='<h3>Варианты</h3>'+ks.map(function(k){return pc(k,k==r.mx?'🔝 Максимум':'↩️ Запасной')}).join('');
return h+'<button class="ic" style="width:100%;margin:8px 0" onclick="S.st=5;S.tab=0;draw();scrollTo(0,0)">📜 К цене в скрипте</button>'}
function bindCalc(){[['ih','h'],['iw','w'],['ia','a'],['it','t']].forEach(function(p){$(p[0]).oninput=function(){S[p[1]]=this.value;save();$('co').innerHTML=calcOut()}});$('gf').onclick=function(){S.g='f';save();draw()};$('gm').onclick=function(){S.g='m';save();draw()}}
var CMP=[['Corglutid GLP-1','Главный контролёр аппетита: вдохновлён гормоном сытости GLP-1, поэтому сытость держится дольше и меньше тянет на перекусы.','Заявлен как компонент, вдохновлённый сигнализацией ГПП-1; работает в связке с инулином, чьи метаболиты стимулируют ГПП-1 и PYY.','Вы говорили про вечерние перекусы: здесь он помогает дольше чувствовать сытость.'],['Шафран','Работает на настроение: меньше желания заедать стресс сладким.','Кроцины, пикрокроцин, сафранал; ассоциируется с поддержкой настроения и снижением эмоционального переедания.','Вы сказали, что заедаете стресс, шафран как раз про это.'],['Джимнема','Приглушает вкус сладкого: шоколад и конфеты притягивают меньше.','Гимнемовые кислоты конкурируют за рецепторы сладкого на языке.','Сложно без сладкого? Здесь поможет джимнема.'],['L-теанин','Мягкое спокойствие без сонливости: проще не набрасываться на еду вечером и лучше спать.','Аминокислота зелёного чая, модулирует ГАМК/глутаматную передачу, повышает альфа-активность мозга.','Нервничаете и плохо спите? Теанин поддержит спокойствие.'],['Белая фасоль','Замедляет усвоение крахмала из хлеба и макарон, после еды меньше тянет на добавку.','Фазеолин ингибирует α-амилазу и сглаживает гликемическую кривую.','Любите хлеб и макароны? Фасоль подстрахует.'],['Афрамомум мелегета','Пряность, «внутренний обогреватель»: поддерживает расход энергии.','6-параол и 6-гингерол; связывают с термогенезом.','Для вашей цели нужен живой метаболизм, это про него.'],['Таурин','Тонус без кофеина и водный баланс: меньше спада сил к обеду.','Осморегуляция клеток, конъюгация жёлчных кислот.','Нет сил к обеду? Таурин за это отвечает.'],['L-тирозин','Сырьё для гормонов бодрости и концентрации, помогает без лишнего кофе.','Предшественник дофамина, норадреналина и тиреоидных гормонов.','Кофе не спасает? Вот альтернатива.'],['CLA','Помогает фигуре подтягиваться, а не просто терять вес; лучше работает с движением.','Изомеры линолевой кислоты, небольшое влияние на состав тела.','Хотите подтянуть фигуру, а не только вес?'],['Глутатион','Главный антиоксидант и внутренний фильтр: свежая кожа, меньше усталости.','Трипептид GSH, внутриклеточная антиоксидантная система.','Кожа, усталость, очищение — это про глутатион.'],['Витамин C','Красота и иммунитет: коллаген, упругая кожа; «перезаряжает» глутатион.','Кофактор синтеза коллагена, регенерирует глутатион.','Для красоты и тонуса это база.'],['Инулин','Еда для хороших бактерий: комфортнее пищеварение и сильнее сытость. В первые дни возможно вздутие, пейте больше воды.','Пребиотический фруктан, ферментация до короткоцепочечных жирных кислот.','Комфортный живот и спокойный аппетит, это его работа.']];
function cmpCard(c){var e=S.mode=='e';return line('say',c[0],(e?c[2]:c[1])+'<br><i>🌉 '+c[3]+'</i>')}
function compPane(){var e=S.mode=='e';return'<h2>🧪 Состав SAF</h2><div class="chips"><button class="'+(e?'':'on')+'" onclick="S.mode=\'s\';draw()">🙋 Простым языком</button><button class="'+(e?'on':'')+'" onclick="S.mode=\'e\';draw()">🔬 Научный</button></div><h3>Капсулы «Контроль аппетита»</h3>'+CMP.slice(0,5).map(cmpCard).join('')+'<h3>Саше «Lite &amp; Balance»</h3>'+CMP.slice(5).map(cmpCard).join('')}
function drawTab(){var t=S.tab;$('m').innerHTML=t==1?calcPane():t==2?compPane():'<h2>💰 Прайс и Kaspi</h2>'+prices();if(t==1){$('co').innerHTML=calcOut();bindCalc()}save()}
function go(i){S.tab=0;S.st=Math.max(0,Math.min(ST.length-1,i));draw();scrollTo(0,0)}
$('bk').onclick=function(){go(S.st-1)};$('nx').onclick=function(){go(S.st+1)};
$('ob').onclick=objSheet;$('hl').onclick=function(){hlSheet(-1)};
$('ov').onclick=function(e){if(e.target==this)hide()};
$('nm').value=S.name;$('nm').oninput=function(){S.name=this.value;save();if(!$('ov').classList.contains('on'))draw()};
$('rs').onclick=function(){if(confirm('Начать новый звонок? Текущий прогресс и данные клиента будут сброшены.')){S={st:0,name:'',tier:2,promo:0,res:'',notes:{}};$('nm').value='';save();draw();scrollTo(0,0)}};
document.addEventListener('keydown',function(e){if(/INPUT|TEXTAREA/.test(document.activeElement.tagName))return;if(e.key=='Escape')hide();if($('ov').classList.contains('on'))return;if(e.key=='ArrowRight')go(S.st+1);if(e.key=='ArrowLeft')go(S.st-1);if(e.key=='o')objSheet();if(e.key=='h')hlSheet(-1)});
draw();
</script></body></html>
