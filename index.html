<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SAF · Ультимативный Продажник</title>
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#121212;--gl:rgba(255,255,255,.06);--bd:rgba(255,255,255,.1);--tx:#ececec;--mu:#9a9a9a;--em:#10B981;--emd:rgba(16,185,129,.15);--wr:#f59e0b;--rd:#ef4444}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:140px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(18,18,18,.95);backdrop-filter:blur(16px);padding:10px 12px;border-bottom:1px solid var(--bd)}
#q{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--bd);background:var(--gl);color:var(--tx);font-size:16px;outline:none}
#q:focus{border-color:var(--em)}
main{padding:12px}
.cpm{display:none}
.card{background:var(--gl);border:1px solid var(--bd);border-radius:16px;padding:14px;margin:0 0 10px;backdrop-filter:blur(10px)}
.card.flash{border-color:var(--em);background:var(--emd)}
h2{font-size:18px;margin:0 0 8px} h3{font-size:15px;margin:0 0 6px;color:var(--em)}
.mu{color:var(--mu);font-size:13px}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
input,select{width:100%;padding:11px;border-radius:12px;border:1px solid var(--bd);background:#1c1c1c;color:var(--tx);font-size:16px}
label{font-size:12px;color:var(--mu)}
button{font:inherit;cursor:pointer}
.btn{border:0;border-radius:12px;padding:12px;background:var(--em);color:#04210f;font-weight:700;width:100%;text-align:center}
.cp{border:1px solid var(--bd);background:transparent;color:var(--em);border-radius:8px;padding:4px 8px;font-size:11px;margin-top:6px;display:inline-block}
.seg{display:flex;background:#1c1c1c;border-radius:12px;padding:3px;margin-bottom:10px}
.seg button{flex:1;border:0;background:transparent;color:var(--mu);padding:8px 4px;border-radius:10px;font-size:12px;text-align:center}
.seg button.on{background:var(--em);color:#04210f;font-weight:700}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;padding-bottom:4px}
.chips button{white-space:nowrap;border:1px solid var(--bd);background:var(--gl);color:var(--tx);border-radius:20px;padding:6px 12px;font-size:13px}
.chips button.on{border-color:var(--em);background:var(--emd);color:var(--em)}
.big{font-size:28px;font-weight:800;color:var(--em)}
.tag{display:inline-block;font-size:11px;padding:2px 6px;border-radius:6px;background:var(--emd);color:var(--em)}

/* Прогресс-бар */
.progress-container{background:#1c1c1c;border-radius:10px;height:8px;width:100%;margin:8px 0 12px;overflow:hidden;border:1px solid var(--bd)}
.progress-bar{background:var(--em);height:100%;width:0%;transition:width .3s ease}

/* Навигация снизу */
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:rgba(18,18,18,.95);backdrop-filter:blur(16px);border-top:1px solid var(--bd);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;border:0;background:transparent;color:var(--mu);font-size:10px;padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:18px} nav button.on{color:var(--em)}

#wolf{position:fixed;right:12px;bottom:calc(74px + env(safe-area-inset-bottom,0px));z-index:40;border:0;border-radius:24px;padding:10px 14px;background:linear-gradient(135deg,#10B981,#047857);color:#fff;font-weight:700;box-shadow:0 4px 15px rgba(16,185,129,.4);font-size:13px}
#ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.75);display:none;align-items:flex-end}
#ov.show{display:flex}
#sheet{background:#181818;border-radius:22px 22px 0 0;max-height:85%;overflow:auto;width:100%;padding:14px;border-top:1px solid var(--bd)}
#toast{position:fixed;left:50%;top:20px;transform:translate(-50%,-20px);background:var(--em);color:#04210f;font-weight:700;padding:8px 14px;border-radius:20px;opacity:0;transition:.25s;z-index:99;pointer-events:none;font-size:13px}
#toast.show{opacity:1;transform:translate(-50%,0)}
.pane{display:none}.pane.on{display:block}
table{width:100%;border-collapse:collapse}
</style></head><body>

<header>
  <input id="q" type="search" placeholder="🔍 Быстрый поиск: дорого, давление, побочка, суставы…" autocomplete="off">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px">
    <span id="step-title" style="font-size:12px;color:var(--mu);font-weight:600">Шаг 1 из 5</span>
    <span id="step-name" style="font-size:12px;color:var(--em)">Калькулятор веса</span>
  </div>
  <div class="progress-container"><div id="p-bar" class="progress-bar"></div></div>
</header>

<main>
<div id="res" style="display:none"></div>
<div id="panes">
  <section class="pane on" id="p0"></section>
  <section class="pane" id="p1"></section>
  <section class="pane" id="p2"></section>
  <section class="pane" id="p3"></section>
  <section class="pane" id="p4"></section>
</div>
</main>

<button id="wolf">🐺 Волк</button>
<nav id="nav"></nav>
<div id="ov"><div id="sheet"></div></div>
<div id="toast">Скопировано в буфер!</div>

<script>
var S={h:'',w:'',a:'',g:'f',tab:0,stage:0,scen:'A',mode:'s',risk:null,tier:1};
try{var sv=JSON.parse(localStorage.getItem('saf_v2')||'null');if(sv)for(var k in sv)S[k]=sv[k]}catch(e){}
function save(){try{localStorage.setItem('saf_v2',JSON.stringify(S))}catch(e){}}
var $=function(i){return document.getElementById(i)};
var C=[];function cb(t){C.push(t);return '<br><button class="cp" onclick="cp('+(C.length-1)+')">📋 Копировать фразу</button>'}
function cp(i){var t=C[i];var el=$('toast');el.classList.add('show');setTimeout(function(){el.classList.remove('show')},1200);
 try{navigator.clipboard.writeText(t)}catch(e){var a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(e){}a.remove()}}

// Поиск
var IDX=[];
function buildIndex(){
  IDX=[];
  // Возражения
  OB.forEach(function(o){ IDX.push({tab:3, t:'🛡️ '+o[0], x:o[1].join(' '), cp:o[1].join('\n')}) });
  // Здоровье
  RK.forEach(function(r){ [1,2,3].forEach(function(tier){ IDX.push({tab:1, t:'⚠️ '+r[0]+' (Уровень '+tier+')', x:r[tier], cp:r[tier]}) }) });
  // Составы
  CMP.forEach(function(c){ IDX.push({tab:2, t:'🧪 '+c[0], x:c[1]+' '+c[2], cp:c[0]+': '+c[1]}) });
}

function search(v){
  var q=v.toLowerCase().trim(); if(!q)return[];
  return IDX.filter(function(it){ return it.t.toLowerCase().indexOf(q)>-1 || it.x.toLowerCase().indexOf(q)>-1 }).slice(0,8);
}
$('q').addEventListener('input',function(){
  var v=this.value, r=$('res');
  if(!v.trim()){r.style.display='none';$('panes').style.display='';renderAll();return}
  var rs=search(v); renderAll();
  r.style.display=''; $('panes').style.display='none';
  r.innerHTML='<h2>Результаты поиска</h2>'+(rs.length?rs.map(function(it){return '<div class="card"><h3>'+it.t+'</h3><div>'+it.x+'</div>'+cb(it.cp)+'<br><button class="btn" style="margin-top:8px;padding:6px" onclick="go('+it.tab+')">Перейти во вкладку</button></div>'}).join(''):'<div class="card mu">Ничего не найдено</div>');
});
function go(t){S.tab=t; $('q').value=''; $('res').style.display='none'; $('panes').style.display=''; renderAll(); scrollTo(0,0)}

// --- Данные Здоровья с 3 уровнями сложности (1 - короткий, 2 - средний, 3 - длинный/страшилка) ---
var RK=[
['❤️ Давление / Сердце',
 'Лишний вес давит на сердце и поднимает давление. SAF разгонит обмен веществ и снимет нагрузку.',
 'Висцеральный жир заставляет сердце работать на износ, повышая давление и риск сосудистых кризов. Продукт убирает этот фактор.',
 'Ожирение и висцеральный жир — это прямая бомба замедленного действия для сердца. Сосуды забиваются, давление скачет, возрастает риск инфаркта и стационара. Наш комплекс мягко запускает метаболизм и спасает вас от этого сценария.'],
['🦵 Суставы / Спина',
 'Каждый лишний кг — это удар по коленям и позвоночнику. Компьютерный контроль веса снимет эту боль.',
 'Суставы изнашиваются в разы быстрее под тяжестью лишнего веса, вызывая артрозы и боли при ходьбе.',
 'Хрящевая ткань под постоянной перегрузкой стирается в ноль. Дальше идут сильные боли, уколы в суставы и риск операций. Сбросив вес с SAF, вы разгрузите ноги и вернете легкость движения.'],
['🩸 Сахар / Диабет',
 'Лишний вес садит чувствительность клеток к инсулину. Наш комплекс защищает от сахарных скачков.',
 'Висцеральный жир провоцирует инсулинорезистентность — предвестник диабета 2-го типа.',
 'Сахарные качели истощают поджелудочную, ведя к диабету, проблемам с почками и зрением. SAF чистит организм и держит углеводы под строгим контролем.'],
['💧 Отёки / Одышка',
 'Одышка и утренние отёки говорят о застое жидкости и перегрузке мотора.',
 'Жидкость застаивается в тканях, сердце и легкие работают на пределе, вызывая одышку даже на 2-й этаж.',
 'Отеки и одышка — первый признак того, что лимфосистема и сосуды заблокированы шлаками и жиром. Саше Lite & Balance запускают дренаж и очищение с первого дня.'],
['😴 Храп / Апноэ',
 'Лишний вес сужает горло во сне, отсюда храп и утренняя разбитость.',
 'Ночное апноэ (остановка дыхания) из-за жира на шее лишает мозг кислорода, убивая сосуды.',
 'Храп — это не просто звук, это кислородное голодание мозга каждую ночь! Растет риск инсульта. Убирая вес, мы открываем дыхательные пути.'],
['🦋 Гормоны / Щитовидка',
 'Вес и гормоны связаны в кольцо: одно тянет за собой другое.',
 'Сбои щитовидки и кортизола блокируют похудение, превращая организм в склад жира.',
 'Порочный круг: стресс и гормоны копят жир, а жир глушит гормоны. Нутрициолог и комплекс SAF разорвут этот круг.'],
['🌿 ЖКТ / Печень (Гепатоз)',
 'Жир оседает на печени, вызывая тяжесть и замедление обмена.',
 'Жировой гепатоз печени и застой желчи блокируют расщепление жиров.',
 'Печень заплывает жиром, пищеварение встает, токсины отравляют тело. Наш детокс-комплекс восстанавливает работу ЖКТ.'],
['👂 Шум в ушах / Головокружение',
 'Шум в ушах и мушки в глазах — частый спутник скачущего давления из-за веса.',
 'Густой липидный профиль и давление нарушают микроциркуляцию крови в голове.',
 'Когда сосуды забиты, мозг страдает от нехватки кислорода: отсюда шум в ушах, мигрени и риск сосудистых катастроф. SAF приводит кровь и сосуды в норму.']
];

// --- Возражения ---
var OB=[
['Дорого', ['Понимаю вас, цена — важный вопрос. Скажите, а если бы цена была не вопросом, сама программа вам подходит?', 'Это всего около 1 700 тенге в день — меньше чашки кофе, а в рассрочку Kaspi вообще от 2 167 тг в месяц. Какой курс вам ближе: базовая банка или комплекс на 3 месяца с подарком?']],
['Я подумаю', ['Конечно, решение важное. Обычно «подумаю» значит, что остался один вопрос: цена или сомнения в продукте?', 'Давайте разберем его прямо сейчас, чтобы вы принимали решение на основе фактов. Что именно вас останавливает?']],
['Не хочу худеть / Нормальный вес', ['Отлично, что вы в форме! Но многим важны не столько кг, сколько чистка от токсинов, уход от утренних отёков и прилив энергии.', 'Саше Lite & Balance и капсулы работают как генератор энергии и чистка ЖКТ. Хотите чувствовать себя бодрее?']],
['Не верю в БАДы / Не помогло', ['Я вас прекрасно понимаю, на вашем месте тоже бы сомневалась после неудачного опыта.', 'Именно поэтому с вами на связи 24/7 работает личный нутрициолог, который выстраивает систему под вас, а не просто дает банку.']],
['Посоветуюсь с мужем / врачом', ['Это очень правильный подход. Если муж/врач оценит состав, вы готовы начать?', 'Давайте я скину вам детальный разбор компонентов, чтобы вам было удобно показать его специалисту.']]
];

// --- Составы ---
var CMP=[
['Корглутид GLP-1', 'Главный имитатор гормона сытости: помогает реже перекусывать и дольше держать сытость.', 'Вдохновлен L-клетками кишечника, замедляет опорожнение желудка и влияет на центр насыщения в мозге.'],
['Шафран', 'Мягкий антистресс: снимает тягу к сладкому и успокаивает нервы при диете.', 'Поддерживает серотонинергическую передачу, блокируя эмоциональное переедание.'],
['Джимнема лесная', 'Приглушает рецепторы сладкого: шоколад и конфеты уже не кажутся такими манящими.', 'Гимнемовые кислоты конкурентно связываются с рецепторами языка, снижая тягу к углеводам.'],
['L-теанин', 'Успокаивает без сонливости: ясная голова и защита от зажоров на нервной почве.', 'Модулирует ГАМК и снижает кортизол, помогая крепко спать.'],
['Белая фасоль', 'Мягкий блокатор углеводов: уменьшает всасывание крахмала из хлеба и макарон.', 'Содержит фазеолин — природный ингибитор альфа-амилазы.'],
['Афрамомум мелегета', 'Внутренний обогреватель: активирует термогенез и сжигание калорий.', 'Стимулирует бурую жировую ткань и расход энергии.'],
['Таурин', 'Энергия для мышц и клеток без скачков давления и кофеина.', 'Улучшает осморегуляцию и работу желчных кислот.'],
['L-тирозин', 'Фокус и бодрость при дефиците калорий, защита от упадка сил.', 'Предшественник дофамина и норадреналина.'],
['CLA (Конъюг. линолевая к-та)', 'Помогает организму сжигать именно жир, сохраняя тонус тела.', 'Модулирует липидный обмен в жировом депо.'],
['Глутатион', 'Мощнейший щит клеток и антиоксидант для молодости и детокса.', 'Главный внутриклеточный фильтр печени.'],
['Витамин C', 'Иммунитет, защита клеток и синтез упругого коллагена кожи.', 'Кофактор коллагеногенеза и регенератор глутатиона.'],
['Инулин', 'Пребиотик для комфортного живота, хорошей микрофлоры и сытости.', 'Фруктин, ферментирующийся полезными бактериями в кишке.']
];

var PR=[['1 банка',1,52000,4333,2167],['2+1',3,104000,8667,4333],['3+2',5,156000,13000,6500],['4+3',7,208000,17333,8667],['5+5',10,260000,21667,10833],['6+6',12,312000,26000,13000]];

buildIndex();

// --- Рендеринг вкладок ---

// Вкладка 0: Вес и ИМТ
function p0(){
  var h=+S.h, w=+S.w;
  var b=(h&&w)? w/Math.pow(h/100,2) : 0;
  var st = b==0?'' : b<18.5?'Дефицит массы':b<25?'Норма':b<30?'Избыточный вес':'Ожирение';
  
  return '<h2>⚖️ Шаг 1: Экспресс-анализ веса</h2>' +
         '<div class="card"><div class="row"><div><label>Рост (см)</label><input id="h" type="number" value="'+S.h+'"></div><div><label>Вес (кг)</label><input id="w" type="number" value="'+S.w+'"></div></div></div>' +
         (b>0 ? '<div class="card"><div class="mu">Индекс массы тела (ИМТ)</div><div class="big">'+b.toFixed(1)+'</div><span class="tag">'+st+'</span></div>' : '') +
         '<button class="btn" onclick="S.tab=1;save();renderAll()">Далее к скрипту звонка ➔</button>';
}

// Вкладка 1: Поэтапный Скрипт (с гибкими кнопками экстренного прыжка к здоровью)
function p1(){
  var stages=['1. Приветствие','2. Диагностика','3. Презентация SAF','4. Цена и Подарок','5. Закрытие'];
  var h='<h2>📜 Шаг 2: Живой Скрипт Продажи</h2>' +
        '<div class="chips">'+stages.map(function(s,i){return '<button class="'+(S.stage==i?'on':'')+'" onclick="S.stage='+i+';save();renderAll()">'+s+'ഭി</button>'}).join('')+'</div>';
  
  if(S.stage==0){
    h+='<div class="card"><h3>Приветствие</h3>' +
       '<div>Здравствуйте! Меня зовут [Имя], я эксперт компании SAF по контролю веса. Вы оставляли заявку на консультацию, верно?</div>' +
       cb('Здравствуйте! Меня зовут [Имя], я эксперт компании SAF по контролю веса. Вы оставляли заявку на консультацию, верно?')+'</div>' +
       '<div class="card"><h3>Утепление</h3>' +
       '<div>Удобно сейчас уделить 5 минут? Давайте задам пару вопросов по здоровью, чтобы подобрать точную дозировку, хорошо?</div>' +
       cb('Удобно сейчас уделить 5 минут? Давайте задам пару вопросов по здоровью, чтобы подобрать точную дозировку, хорошо?')+'</div>';
  } else if(S.stage==1){
    h+='<div class="card"><h3>Диагностика потребностей</h3>' +
       '<div>1. Подскажите, сколько кг хотите убрать?<br>2. Тянет ли по вечерам на сладкое/мучное?<br>3. Как со сном, стрессом и отёками?</div>' +
       cb('Подскажите, сколько кг хотите убрать? Тянет ли по вечерам на сладкое? Как со сном и отёками?')+'</div>' +
       '<div class="card"><h3>⚠️ Клиент назвал проблему со здоровьем?</h3><div class="mu">Выберите из списка ниже любую проблему, чтобы мгновенно отработать её с 3 уровнями страшилок:</div>' +
       RK.map(function(r,i){return '<button class="btn" style="background:#1c1c1c;color:var(--tx);margin-top:6px;text-align:left;border:1px solid var(--bd)" onclick="S.risk='+i+';renderAll()">'+r[0]+'</button>'}).join('')+'</div>';
    
    if(S.risk!==null){
      var r=RK[S.risk];
      h+='<div class="card" style="border-color:var(--em)">' +
         '<h3>⚡ Отработка: '+r[0]+'</h3>' +
         '<div class="seg"><button class="'+(S.tier==1?'on':'')+'" onclick="S.tier=1;renderAll()">1. Коротко</button><button class="'+(S.tier==2?'on':'')+'" onclick="S.tier=2;renderAll()">2. Средне</button><button class="'+(S.tier==3?'on':'')+'" onclick="S.tier=3;renderAll()">3. Жестко</button></div>' +
         '<div style="font-size:15px;margin-top:8px">'+r[S.tier]+'</div>'+cb(r[S.tier])+'</div>';
    }
  } else if(S.stage==2){
    h+='<div class="card"><h3>Презентация SAF</h3>' +
       '<div>SAF — это двойной комплекс. Капсулы «Контроль аппетита» на кормушке GLP-1 убирают тягу к сладкому и зажоры. А саше Lite & Balance разгоняют метаболизм, дают энергию и чистят организм. Без голода и срывов.</div>' +
       cb('SAF — это двойной комплекс. Капсулы убирают тягу к сладкому, а саше разгоняют метаболизм и дают энергию.')+'</div>';
  } else if(S.stage==3){
    h+='<div class="card"><h3>Прайс и Личный Подгон</h3>' +
       '<div>Смотрите, стандартно курс идет баночный. Но вы мне очень понравились, я вижу настрой на результат. Я согласовал(а) с руководством: при заказе комплекса мы даем вам еще столько же упаковок саше В ПОДАРОК!</div>' +
       cb('Я согласовал с руководством: при заказе комплекса мы даем вам в подарок упаковки саше Lite & Balance!')+'</div>' +
       '<div class="card"><h3>Тарифы</h3>' +
       PR.map(function(p){return '<b>'+p[0]+' ('+p[1]+' мес):</b> '+p[2].toLocaleString()+' ₸ (Kaspi 12 мес: '+p[3].toLocaleString()+' ₸/мес)'+cb('Тариф '+p[0]+': '+p[2].toLocaleString()+' тг, по Kaspi '+p[3].toLocaleString()+' тг в мес.')+'<hr style="border-color:var(--bd);margin:8px 0">'}).join('')+'</div>';
  } else {
    h+='<div class="card"><h3>Закрытие на сделку</h3>' +
       '<div>Вам удобнее оформить сразу или через рассрочку Kaspi на 12 месяцев? Куда отправлять подтверждение заказа?</div>' +
       cb('Вам удобнее оформить сразу или через рассрочку Kaspi? Куда отправить подтверждение заказа?')+'</div>';
  }
  return h;
}

// Вкладка 2: Составы
function p2(){
  return '<h2>🧪 Шаг 3: Составы капсул и саше</h2>' +
         '<div class="seg"><button class="'+(S.mode=='s'?'on':'')+'" onclick="S.mode=\'s\';renderAll()">Просто</button><button class="'+(S.mode=='e'?'on':'')+'" onclick="S.mode=\'e\';renderAll()">Научно</button></div>' +
         CMP.map(function(c){
           var txt = S.mode=='s'? c[1] : c[2];
           return '<div class="card"><h3>'+c[0]+'</h3><div>'+txt+'</div>'+cb(c[0]+': '+txt)+'</div>';
         }).join('');
}

// Вкладка 3: Возражения
function p3(){
  return '<h2>🛡️ Шаг 4: Отработка возражений</h2>' +
         OB.map(function(o){
           return '<div class="card"><h3>'+o[0]+'</h3>'+o[1].map(function(t,i){return '<div style="margin-top:6px"><span class="tag">Шаг '+(i+1)+'</span><br>'+t+'</div>'}).join('')+cb(o[1].join('\n'))+'</div>';
         }).join('');
}

// Вкладка 4: Прайс
function p4(){
  return '<h2>💰 Шаг 5: Прайс-лист и Kaspi рассрочка</h2>' +
         PR.map(function(p){
           return '<div class="card"><div style="display:flex;justify-content:space-between"><b>'+p[0]+' ('+p[1]+' мес)</b><span class="tag">Хит</span></div>' +
                  '<div class="big" style="font-size:24px;margin:4px 0">'+p[2].toLocaleString()+' ₸</div>' +
                  '<div class="mu">Kaspi 12 мес: <b>'+p[3].toLocaleString()+' ₸/мес</b></div>'+cb('Тариф '+p[0]+': '+p[2].toLocaleString()+' тенге')+'</div>';
         }).join('');
}

// Менюшка Волка (Универсальная отработка)
function wolf(){
  $('sheet').innerHTML='<h2>🐺 Алгоритм Волка</h2>' +
    '<div class="card"><b>1. Смягчение:</b><br>Я вас абсолютно понимаю, на вашем месте я бы думал точно так же.</div>' +
    '<div class="card"><b>2. Изоляция:</b><br>А если отбросить этот момент, в целом программа и цель скинуть вес вам откликаются?</div>' +
    '<div class="card"><b>3. Перепродажа:</b><br>Тогда давайте оформим по акции с подарками, результат того стоит!</div>';
  $('ov').classList.add('show');
}
$('wolf').onclick=wolf;
$('ov').onclick=function(e){if(e.target===this)this.classList.remove('show')};

// Рендер табов и прогресса
var TB=[['⚖️','Вес'],['📜','Скрипт'],['🧪','Состав'],['🛡️','Возраж.'],['💰','Прайс']];
$('nav').innerHTML=TB.map(function(t,i){return '<button onclick="go('+i+')" id="n'+i+'"><span>'+t[0]+'</span>'+t[1]+'</button>'}).join('');

function renderAll(){
  var f=[p0,p1,p2,p3,p4];
  C=[]; save();
  
  // Прогресс бар
  var pct = (S.tab / (f.length - 1)) * 100;
  $('p-bar').style.width = pct + '%';
  $('step-title').innerText = 'Шаг '+(S.tab+1)+' из '+f.length;
  $('step-name').innerText = TB[S.tab][1];

  f.forEach(function(fn,i){
    var p=$('p'+i);
    p.classList.toggle('on', S.tab==i);
    $('n'+i).classList.toggle('on', S.tab==i);
    if(S.tab==i) p.innerHTML=fn();
  });
  
  var hInput = $('h'), wInput = $('w');
  if(hInput) hInput.oninput = function(){S.h=this.value; save()};
  if(wInput) wInput.oninput = function(){S.w=this.value; save()};
}

renderAll();
</script>
</body></html>
