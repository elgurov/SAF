<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SAF · Помощник менеджера</title>
<style>
:root{--bg:#f6f7f6;--cd:#fff;--bd:#dcdedc;--tx:#17201b;--mu:#5d6862;--em:#0a8f62;--emd:#dff3ea;--bl:#1d5fb4;--bld:#e4eefb;--wr:#8a5a00;--wrd:#fff3d6;--rd:#b3261e;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121212;--cd:#1c1f1d;--bd:#333835;--tx:#ececec;--mu:#9aa39e;--em:#34d399;--emd:#12382b;--bl:#7db3ff;--bld:#14263d;--wr:#fbbf24;--wrd:#3a2d0c;--rd:#f87171;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121212;--cd:#1c1f1d;--bd:#333835;--tx:#ececec;--mu:#9aa39e;--em:#34d399;--emd:#12382b;--bl:#7db3ff;--bld:#14263d;--wr:#fbbf24;--wrd:#3a2d0c;--rd:#f87171;color-scheme:dark}
*{box-sizing:border-box}html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 -apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:90px;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:11}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);padding:8px 12px;border-bottom:1px solid var(--bd)}
.row{display:flex;gap:8px;align-items:center}.row>*{min-width:0}
input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--cd);color:var(--tx);font-size:16px}
button{font:inherit;cursor:pointer;color:var(--tx)}
.ic{flex:none;border:1px solid var(--bd);background:var(--cd);border-radius:10px;padding:8px 12px}
#pb{display:flex;gap:4px;margin-top:8px}#pb button{flex:1;border:0;background:none;padding:0;font-size:10px;color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#pb i{display:block;height:5px;border-radius:3px;background:var(--bd);margin-bottom:3px}.done i,.cur i{background:var(--em)!important}.cur{color:var(--em)!important;font-weight:700}
main{padding:12px;max-width:760px;margin:0 auto}
h2{font-size:20px;margin:4px 0}h3{font-size:13px;margin:14px 0 6px;color:var(--mu);text-transform:uppercase;letter-spacing:.04em}
.mu{color:var(--mu);font-size:13px}
.L{border-radius:12px;padding:10px 12px;margin:0 0 8px;cursor:pointer;border-left:5px solid}
.L b{display:block;font-size:11px;letter-spacing:.05em;margin-bottom:2px}
.s{background:var(--emd);border-color:var(--em)}.s b{color:var(--em)}
.q{background:var(--bld);border-color:var(--bl)}.q b{color:var(--bl)}
.n{background:var(--wrd);border-color:var(--wr);color:var(--wr);cursor:default;font-size:14px}
.card{border:1px solid var(--bd);background:var(--cd);border-radius:12px;padding:10px 12px;margin:0 0 8px}
details{margin:0 0 8px;border:1px solid var(--bd);background:var(--cd);border-radius:12px;padding:2px 12px}summary{cursor:pointer;font-weight:600;padding:9px 0}
details[open]{padding-bottom:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.chips button{border:1px solid var(--bd);background:var(--cd);border-radius:18px;padding:6px 12px;font-size:13px}.chips .on{background:var(--emd);border-color:var(--em);color:var(--em);font-weight:700}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;gap:6px;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--bd)}
.bar button{flex:1;border:1px solid var(--bd);background:var(--cd);border-radius:12px;padding:12px 4px;font-size:14px;font-weight:600}
.bar .nx{background:var(--em);color:#fff;border-color:var(--em);flex:1.3}
.big{font-size:20px;font-weight:800}.old{text-decoration:line-through;color:var(--mu);font-size:13px}
.pr{display:flex;justify-content:space-between;gap:8px;align-items:center}
#toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--em);color:#fff;padding:8px 14px;border-radius:18px;opacity:0;transition:opacity .2s;z-index:99;pointer-events:none;font-weight:700}#toast.on{opacity:1}
</style></head><body>
<header><div class="row"><input id="nm" placeholder="Имя клиента" autocomplete="off"><button class="ic" id="rs" title="Новый звонок">⟲</button></div><div id="pb"></div><div class="chips" id="tb"></div></header>
<main id="m"></main>
<div class="bar"><button id="bk">← Назад</button><button id="nx" class="nx">Далее →</button></div>
<div id="toast">Скопировано</div>
<script>
var PR=[['1 банка',1,52000,4333,2167],['2+1',3,104000,8667,4333],['3+2',5,156000,13000,6500],['4+3',7,208000,17333,8667],['5+5',10,260000,21667,10833],['6+6',12,312000,26000,13000]];
var S={st:0,tab:0,name:'',res:''};
try{var sv=JSON.parse(localStorage.getItem('saf3')||'null');if(sv)for(var k in sv)S[k]=sv[k]}catch(e){}
function save(){try{localStorage.setItem('saf3',JSON.stringify(S))}catch(e){}}
var $=function(i){return document.getElementById(i)},C=[];
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function fm(n){return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,' ')}
function fill(t){return t.replace(/,? ?\{имя\}/g,S.name?', '+esc(S.name):'')}
function cp(i){var t=C[i];function ok(){var e=$('toast');e.classList.add('on');setTimeout(function(){e.classList.remove('on')},1000)}
 try{navigator.clipboard.writeText(t).then(ok,ok)}catch(e){ok()}}
function say(t){C.push(fill(t).replace(/<[^>]+>/g,''));return'<div class="L s" onclick="cp('+(C.length-1)+')"><b>🗣 СКАЖИТЕ</b>'+fill(t)+'</div>'}
function ask(t){C.push(fill(t));return'<div class="L q" onclick="cp('+(C.length-1)+')"><b>❓ СПРОСИТЕ — и помолчите, слушайте ответ</b>'+fill(t)+'</div>'}
function note(t){return'<div class="L n">💡 '+t+'</div>'}
/* ветка: [реакция клиента, [реплики: s:/q:/n:]] */
function blk(a){return a.map(function(x){var k=x.slice(0,2),t=x.slice(2);return k=='s:'?say(t):k=='q:'?ask(t):note(t)}).join('')}
function branches(b){if(!b||!b.length)return'';return'<h3>Что ответил клиент — выберите ветку</h3>'+b.map(function(x){return'<details><summary>«'+x[0]+'»</summary>'+blk(x[1])+'</details>'}).join('')}

var ST=[
{n:'Контакт',g:'Первые 30 секунд: представиться, подтвердить заявку, расположить к себе. Про компанию пока не рассказываем.',
main:['s:Здравствуйте! Это ___ из компании SAF, я эксперт по контролю веса. Вы оставляли у нас заявку на консультацию, вот по ней и звоню.','q:Подскажите, как мне к вам лучше обращаться?','s:Очень приятно! Сразу предупрежу: разговор записывается, для контроля качества.','q:С какого вы города?','n:🎙 Улыбнитесь до того, как клиент ответил. Голос тёплый, бодрый, без скороговорки. Задали вопрос — пауза, не перебивайте. Имя называйте 2–3 раза за звонок.'],
b:[['Да, оставляла',['s:Отлично, тогда не буду тянуть, давайте к делу.']],
['Не помню заявку',['s:Бывает! Она пришла с нашего сайта по теме контроля веса.','q:Тема вам знакома или уже неактуальна?','n:Знакома — продолжайте. Неактуальна — вежливо завершите.']],
['Это реклама?',['s:Нет, я звоню лично по вашей заявке. Консультация бесплатная, ни к чему не обязывает.','q:Давайте я коротко объясню, о чём речь, а вы решите. Хорошо?']],
['Сейчас неудобно',['s:Понимаю, не буду отнимать время.','q:Когда лучше перезвонить: сегодня вечером или завтра днём?','n:Запишите точное время и перезвоните ровно в него.']],
['Уже не актуально',['s:Спасибо, что сказали честно.','q:А если без учёта цены, что для вас сейчас важнее: фигура, энергия или самочувствие?','n:Одна попытка. Если снова нет, поблагодарите и завершите.']]],
t:'Слово «эксперт» и конкретное имя убирают ощущение «колл-центра». Не читайте текст, а говорите своими словами: смысл важнее дословности.'},
{n:'Рамка и слово',g:'За минуту: интерес, согласие на 10–15 минут, план разговора и секретное слово.',
main:['s:Коротко, о чём речь. У нас комплекс SAF: капсулы, которые помогают контролировать аппетит, и саше для обмена веществ и энергии. И нутрициолог рядом на всём пути. Хочу понять, подойдёт ли он именно вам.','q:Вам это в принципе интересно: вес, аппетит, тяга к сладкому?','s:Тогда давайте по плану, чтобы вы остались довольны. Сначала я задам несколько вопросов о вас, потом подберу курс и условия, и в конце, если всё подойдёт, помогу оформить. Хорошо?','q:Мне понадобится минут 10–15. Вам сейчас удобно?','s:И один важный момент. По ходу разговора у нас откроется промокод со скидкой. Чтобы его активировать, понадобится секретное слово. Оно такое: «ЛЕГКОСТЬ». Запомните, пожалуйста.','q:Повторите, пожалуйста, чтобы я была уверена, что вы его услышали.','n:🔑 Слово произносите чётко, чуть медленнее. Клиент должен повторить вслух. Вернётесь к нему на этапе цены.'],
b:[['Да, интересно, удобно',['s:Отлично, тогда начнём.']],
['Расскажите подробнее сразу',['s:Расскажу обязательно, но чтобы не грузить лишним, сначала пара вопросов о вас. Тогда я расскажу именно то, что вам нужно.']],
['Неудобно / нет времени',['s:Понимаю.','q:Когда мне перезвонить, чтобы вы поговорили спокойно?','n:Запишите время. Переходите к возражению «Нет времени» на соответствующей вкладке при необходимости.']],
['Напишите в WhatsApp',['s:Конечно, отправлю. Но чтобы прислать именно то, что вам нужно, дайте мне пять минут на пару вопросов.','q:Нормально?']],
['Забыла слово / не повторила',['s:Ничего, повторю ещё раз: «ЛЕГКОСТЬ». Это слово про состояние, к которому вы идёте.','q:Запомнили?']]],
t:'Первое «да» на план облегчает все следующие. Слово «ЛЕГКОСТЬ» нужно не пропустить: оно сработает на этапе цены.'},
{n:'Потребность',g:'Выяснить цель, боль и что для клиента важно. Клиент говорит 70%.',
main:['s:Давайте я узнаю вас получше, чтобы предложить то, что подойдёт именно вам. У меня много клиенток с похожей ситуацией, поэтому можно говорить открыто.','q:Сколько вам лет, какой у вас рост и вес?','q:Сколько килограммов хотите убрать и к какому сроку? Есть ли событие, к которому хочется быть в форме?','q:Что вы уже пробовали: питание, БАДы, спорт? Что получилось, а что нет?','q:Что именно сейчас не устраивает: как вы выглядите, как себя чувствуете или и то и другое?','q:Когда обычно тянет на еду: вечером, в стресс, «на автомате»?','q:Как вы себя увидите, когда вернёте форму? Что изменится в жизни?','q:По шкале от 1 до 10: насколько для вас это важно?','n:Рост, вес и цель внесите на вкладке «Курс»: приложение подберёт вариант. Цифры повторите клиенту её словами.'],
b:[['Назвала цель и срок',['s:Правильно понимаю: вы хотите убрать ___ кг к ___?','n:Повторите её слова, не свои.']],
['Не хочет называть вес',['s:Точные цифры не нужны, хватит примерных. Они только для расчёта курса.']],
['Отвечает коротко',['q:Расскажите чуть подробнее?','q:А что ещё?']],
['Оценка важности 7–10',['q:Что вас приводит к такой оценке?','n:Пусть клиент сам объяснит, почему это важно.']],
['Оценка важности 1–5',['q:Что должно было бы случиться, чтобы эта оценка стала выше?']],
['Беременность / ГВ',['s:Тогда сейчас комплекс не подходит. Давайте вернёмся к нему позже.','n:Курс не предлагать, зафиксировать контакт.']],
['Боль в груди, одышка в покое',['s:Это лучше сначала показать врачу.','n:Остановите продажу.']]],
t:'Не продавайте, пока клиент сам не назвал боль и желаемый результат. Вопросы про образ себя после результата — главный рычаг: человек убеждает себя сам.'},
{n:'Подбор',g:'Собрать детали для индивидуальной схемы и показать, что подход персональный.',
main:['s:Отлично, всё записала. Чтобы нутрициолог составил схему именно под вас, уточню ещё несколько деталей. Это пара минут.','q:Есть ли что-то, что вы принимаете постоянно или нужно учесть в питании?','q:Беременность или грудное вскармливание сейчас? Бывает ли аллергия на какие-то компоненты?','q:Как у вас со сном? Именно во сне вырабатываются гормоны, которые влияют на вес и аппетит.','q:Есть ли сейчас стресс или напряжение? Получается ли по-настоящему расслабиться?','q:Критические дни приходят стабильно?','n:Формулировка всегда «для точности подбора» и «чтобы схема сработала у вас». Слова «опасно» и «противопоказания» не используем.'],
b:[['Беременность / ГВ',['s:Тогда сейчас мы ничего не предлагаем. Вернёмся к этому позже.','n:Зафиксируйте контакт и мягко завершите.']],
['Хронические болезни / лекарства',['s:Комплекс не заменяет лечение. Составом лучше поделиться с врачом, а нутрициолог подскажет, как всё совместить.','n:Подробнее: вкладка «Здоровье».']],
['Проблемы со сном / стресс',['s:Это напрямую связано с аппетитом: недосып усиливает тягу к еде. Это учтём в схеме.','n:Вкладка «Здоровье» → «Сон и храп» или «Стресс».']],
['Не хочет отвечать',['s:Всё нормально, отвечайте только на то, что комфортно. Это нужно для точности подбора.']]],
t:'Вопросы тёплые и неспешные. Личные вопросы о близости не задаём: для подбора они не нужны.'},
{n:'Презентация',g:'Связать продукт с тем, что сказал клиент: «вы сказали → в SAF есть → вам это даёт».',
main:['s:{имя}, вы сказали, что ___. Именно для этого создан SAF.','s:SAF — комплекс из двух частей: капсулы для контроля аппетита и саше Lite & Balance для обмена веществ, энергии и пищеварения. Компоненты из Южной Кореи и Германии, готовый продукт производится в Казахстане.','q:Что для вас сейчас важнее всего: меньше тянуть на еду, больше энергии или комфорт в пищеварении?','n:Выберите ветку ниже под ответ клиента. Не рассказывайте всё подряд: 1–2 блока достаточно. После каждого блока пробное закрытие: «Это то, что вам нужно?»'],
b:[['Тянет на сладкое / срываюсь',['s:Для этого в капсулах шафран и джимнема: они снижают тягу к сладкому. А белая фасоль помогает с усвоением углеводов.','s:Corglutid GLP-1 помогает дольше сохранять чувство сытости, поэтому перекусов хочется меньше.','q:Это то, что вам нужно?']],
['Заедаю стресс / плохо сплю',['s:В капсулах L-теанин и шафран: они поддерживают спокойствие и настроение. Проще не набрасываться на еду вечером.','q:Это про вас?']],
['Нет энергии',['s:Саше как раз про это: таурин и L-тирозин поддерживают энергию без кофеина, афрамомум и CLA поддерживают обмен.','q:Подходит?']],
['Тяжело с пищеварением',['s:В саше инулин: он заботится о микрофлоре. В первые дни возможно вздутие, помогает вода.','q:Понятно?']],
['Как принимать',['s:Первая неделя: по одной капсуле утром и вечером. С восьмого дня по две. Саше — стик 2,5 г, вишнёвый вкус.']],
['Какой будет результат',['s:Результат у всех разный, он зависит от питания и режима. Поэтому за вами закрепляется нутрициолог: он на связи 24/7, составит питание и упражнения.','s:Ориентир компании: в первый месяц минус 4–8 кг, к концу второго суммарно 8–16 кг. Это ориентир, не гарантия.','q:Вы готовы преобразиться?']],
['Побочные эффекты',['s:Возможна индивидуальная чувствительность. Нельзя при беременности, ГВ и аллергии на компоненты. При болезнях и лекарствах покажите состав врачу.','q:Есть ли у вас что-то из этого?']],
['Пришлите состав в WhatsApp',['s:Конечно, отправлю.','q:Когда мне позвонить после того, как вы посмотрите?']],
['Молчит / «ну ладно»',['q:Что вам отозвалось больше всего?']]],
t:'Формула: «Вы сказали ___ → у нас есть ___ → значит, у вас будет ___». Подробный состав: вкладка «Состав».'},
{n:'Промокод и цена',g:'Активировать промокод по секретному слову, дать два варианта и спросить выбор.',promo:1,
